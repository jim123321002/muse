<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>森林空地 · Forest Clearing</title>
<!--
  forest.html v3 —— 骑士版：着甲骑士 + 佩剑 + 攻击
  - HDRI: Poly Haven "Forest Slope" (CC0) https://polyhaven.com/a/forest_slope
  - PBR: forest_ground_04 / bark_brown_02 / rock_boulder_dry (CC0, 1K)
  - 松树: "Pine tree" by Poly by Google (CC-BY) via Poly Pizza https://poly.pizza/m/bpV3f5je3rl
  - 骑士: KayKit Adventurers "Knight" (CC0) https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0
  - 剑: "Sword" by Quaternius (CC0) via Poly Pizza https://poly.pizza/m/Ds2bJiNI5w
  - Three.js r160 + postprocessing, import map 走 unpkg / jsdelivr
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e0a;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none; overscroll-behavior:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* 加载遮罩 */
  #loader { position:fixed; inset:0; z-index:50; background:radial-gradient(120% 100% at 50% 20%, #16241a 0%, #0b0e0a 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .8s ease; }
  #loader.done { opacity:0; pointer-events:none; }
  #loader .title { color:#e8f0e2; font-size:20px; letter-spacing:6px; font-weight:600; }
  #loader .sub { color:#8a9a86; font-size:12px; letter-spacing:2px; }
  #barWrap { width:min(64vw,300px); height:4px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  #bar { height:100%; width:0%; border-radius:2px;
    background:linear-gradient(90deg,#7fa36b,#c8d8a8); transition:width .3s ease; }
  #loadStep { color:#aebba8; font-size:12px; min-height:16px; }

  /* 顶部标题 */
  #hud { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:14px; z-index:10;
    color:#f2f5ee; pointer-events:none; opacity:0; transition:opacity 1s ease .3s; }
  #hud.show { opacity:1; }
  #hud h1 { font-size:17px; font-weight:600; letter-spacing:3px; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  #hud p { font-size:11px; color:#c9d4c2; margin-top:4px; letter-spacing:1px; text-shadow:0 1px 8px rgba(0,0,0,.6); }

  /* 右上按钮 */
  #btns { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
    display:flex; flex-direction:column; gap:8px; opacity:0; transition:opacity 1s ease .3s; }
  #btns.show { opacity:1; }
  .cbtn { width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
    background:rgba(20,28,20,.55); color:#eef3e9; font-size:18px; backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cbtn.on { background:rgba(127,163,107,.75); border-color:rgba(255,255,255,.5); }
  .cbtn:active { transform:scale(.93); }

  /* 虚拟摇杆 */
  #joy { position:fixed; left:22px; bottom:calc(30px + env(safe-area-inset-bottom)); z-index:10;
    width:124px; height:124px; border-radius:50%;
    border:2px solid rgba(255,255,255,.28); background:rgba(20,28,20,.35);
    backdrop-filter:blur(4px); display:none; touch-action:none; }
  #joy.show { display:block; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; border-radius:50%;
    background:rgba(240,245,235,.85); box-shadow:0 2px 10px rgba(0,0,0,.4);
    transform:translate(-50%,-50%); }
  /* 跳跃按钮 */
  #jumpBtn { position:fixed; right:26px; bottom:calc(44px + env(safe-area-inset-bottom)); z-index:10;
    width:78px; height:78px; border-radius:50%;
    border:2px solid rgba(255,255,255,.3); background:rgba(127,163,107,.5); color:#fff;
    font-size:15px; font-weight:600; letter-spacing:2px; backdrop-filter:blur(4px);
    display:none; touch-action:none; }
  #jumpBtn.show { display:block; }
  #jumpBtn:active { background:rgba(127,163,107,.85); transform:scale(.94); }
  /* 攻击按钮 */
  #attackBtn { position:fixed; right:26px; bottom:calc(138px + env(safe-area-inset-bottom)); z-index:10;
    width:78px; height:78px; border-radius:50%;
    border:2px solid rgba(255,255,255,.3); background:rgba(178,102,84,.55); color:#fff;
    font-size:30px; backdrop-filter:blur(4px);
    display:none; touch-action:none; }
  #attackBtn.show { display:block; }
  #attackBtn:active { background:rgba(178,102,84,.9); transform:scale(.94); }

  /* 信息卡 */
  #card { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translate(-50%,120%);
    z-index:10; width:min(88vw,340px); padding:14px 16px; border-radius:14px;
    background:rgba(16,22,16,.72); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(10px); color:#eef3e9; transition:transform .35s cubic-bezier(.2,.9,.3,1.2); }
  #card.show { transform:translate(-50%,0); }
  #card h3 { font-size:15px; letter-spacing:2px; margin-bottom:6px; }
  #card p { font-size:12.5px; line-height:1.7; color:#c6d1bf; }
  #card .tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px;
    background:rgba(127,163,107,.35); margin-bottom:8px; letter-spacing:1px; }
  #cardClose { position:absolute; top:8px; right:10px; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(255,255,255,.14); color:#fff; font-size:14px; }

  /* 底部提示 */
  #hint { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:9; color:rgba(240,245,235,.75); font-size:11px; letter-spacing:1px; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.7); opacity:0; transition:opacity 1s ease .6s; white-space:nowrap; }
  #hint.show { opacity:1; }
  #hint.hide { opacity:0 !important; }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <div class="title">森林空地</div>
  <div class="sub">FOREST CLEARING</div>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="loadStep">准备资源…</div>
</div>

<div id="hud"><h1>森林空地</h1><p>Poly Haven 实拍素材 · Three.js</p></div>
<div id="btns">
  <button class="cbtn on" id="autoBtn" title="自动旋转">⟳</button>
  <button class="cbtn" id="resetBtn" title="回到人物">⌖</button>
</div>

<div id="joy"><div id="knob"></div></div>
<button id="attackBtn">⚔️</button>
<button id="jumpBtn">跳跃</button>

<div id="card">
  <button id="cardClose">✕</button>
  <span class="tag" id="cardTag">场景</span>
  <h3 id="cardTitle"></h3><p id="cardDesc"></p>
</div>
<div id="hint"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.3/build/index.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, VignetteEffect } from 'postprocessing';

/* ============ 素材地址（全部真实、可单独访问验证） ============ */
const PH = 'https://dl.polyhaven.org/file/ph-assets';
const ASSETS = {
  hdri: `${PH}/HDRIs/hdr/2k/forest_slope_2k.hdr`,
  ground: {
    map:   `${PH}/Textures/jpg/1k/forest_ground_04/forest_ground_04_diff_1k.jpg`,
    nrm:   `${PH}/Textures/jpg/1k/forest_ground_04/forest_ground_04_nor_gl_1k.jpg`,
    rough: `${PH}/Textures/jpg/1k/forest_ground_04/forest_ground_04_rough_1k.jpg`,
  },
  bark: {
    map:   `${PH}/Textures/jpg/1k/bark_brown_02/bark_brown_02_diff_1k.jpg`,
    nrm:   `${PH}/Textures/jpg/1k/bark_brown_02/bark_brown_02_nor_gl_1k.jpg`,
    rough: `${PH}/Textures/jpg/1k/bark_brown_02/bark_brown_02_rough_1k.jpg`,
  },
  rock: {
    map:   `${PH}/Textures/jpg/1k/rock_boulder_dry/rock_boulder_dry_diff_1k.jpg`,
    nrm:   `${PH}/Textures/jpg/1k/rock_boulder_dry/rock_boulder_dry_nor_gl_1k.jpg`,
    rough: `${PH}/Textures/jpg/1k/rock_boulder_dry/rock_boulder_dry_rough_1k.jpg`,
  },
  pine: './models/pine.glb',                                   // Poly by Google "Pine tree" CC-BY, poly.pizza
  knight: 'https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Characters/gltf/Knight.glb',  // KayKit 骑士 CC0: Idle/Running/1H_Melee_Attack_*
  sword: 'models/sword.glb',  // Quaternius 剑 CC0（base64 存仓库）
};

/* ============ 基础设置 ============ */
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const bar = document.getElementById('bar');
const loadStep = document.getElementById('loadStep');
function setProgress(p, txt) {
  bar.style.width = (p * 100).toFixed(0) + '%';
  if (txt) loadStep.textContent = txt;
}

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9aa88f, 28, 95);   // HDRI 主导的冷绿雾色

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 26;
controls.maxPolarAngle = 1.45;
controls.minPolarAngle = 0.12;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;

/* 简单伪噪声（地形/几何置换） */
function noise2(x, z) {
  return Math.sin(x * 0.31 + z * 0.17) * 0.5 + Math.sin(x * 0.13 - z * 0.29 + 1.7) * 0.3
       + Math.sin(x * 0.71 + z * 0.53 + 4.2) * 0.2;
}
/* 地面高度：与地面网格置换公式严格一致，供树木/岩石/人物采样 */
function groundHeight(x, z) {
  const r = Math.hypot(x, z);
  const flat = THREE.MathUtils.smoothstep(r, 7, 16);
  return (noise2(x, z) * 1.1 + noise2(x * 3.1, z * 3.1) * 0.12) * flat;
}
function jitter(geo, amt, freq = 1) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = noise2(x * freq + y * 0.7, z * freq - y * 0.5);
    p.setXYZ(i, x + n * amt, y + n * amt * 0.7, z + n * amt);
  }
  geo.computeVertexNormals();
  return geo;
}

/* ============ 环境光照（HDRI） ============ */
const pmrem = new THREE.PMREMGenerator(renderer);
const hdrLoader = new RGBELoader();
const gltfLoader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');

setProgress(0.06, '加载森林 HDRI…');
const hdrOk = await new Promise((res) => {
  let done = false;
  const to = setTimeout(() => { if (!done) { done = true; res(false); } }, 30000);
  hdrLoader.load(ASSETS.hdri, (hdr) => {
    if (done) return; done = true; clearTimeout(to);
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = pmrem.fromEquirectangular(hdr).texture;
    scene.background = hdr;
    scene.backgroundBlurriness = 0.035;
    scene.backgroundIntensity = 0.85;
    res(true);
  }, undefined, () => { if (!done) { done = true; clearTimeout(to); res(false); } });
});
if (hdrOk) {
  setProgress(0.28, 'HDRI 就绪 · 加载地面材质…');
} else {
  /* 备用：渐变天空，保证弱网下场景依然可见 */
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256;
  const cx = cv.getContext('2d');
  const gr = cx.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#9fbcd8'); gr.addColorStop(0.55, '#cfd8c8'); gr.addColorStop(1, '#5d6b4a');
  cx.fillStyle = gr; cx.fillRect(0, 0, 4, 256);
  const skyTex = new THREE.CanvasTexture(cv);
  skyTex.mapping = THREE.EquirectangularReflectionMapping;
  skyTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = skyTex;
  scene.environment = pmrem.fromEquirectangular(skyTex).texture;
  setProgress(0.28, 'HDRI 加载超时 · 已启用备用天空');
}

/* ============ 灯光 ============ */
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(18, 26, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd0e8, 0x3a4a2e, 0.35));

/* ============ PBR 材质 ============ */
function pbr(set, rx, ry, srgb = true) {
  const map = texLoader.load(set.map);
  const nrm = texLoader.load(set.nrm);
  const rgh = texLoader.load(set.rough);
  for (const t of [map, nrm, rgh]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx, ry);
    t.anisotropy = 4;
  }
  if (srgb) map.colorSpace = THREE.SRGBColorSpace;
  return { map, nrm, rgh };
}

/* ============ 地面 ============ */
const g = pbr(ASSETS.ground, 14, 14);
const groundMat = new THREE.MeshStandardMaterial({
  map: g.map, normalMap: g.nrm, roughnessMap: g.rgh,
  roughness: 1.0, metalness: 0.0, color: 0xb9c4a8,
});
const groundGeo = new THREE.PlaneGeometry(120, 120, 110, 110);
groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, groundHeight(x, z));
  }
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);
setProgress(0.5, '地面完成 · 种植草叶…');

/* ============ 草（实例化，随风摆动） ============ */
const grassUniforms = { uTime: { value: 0 } };
{
  const blade = new THREE.PlaneGeometry(0.09, 1, 1, 3);
  blade.translate(0, 0.5, 0);
  const N = 4200;
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = blade.index;
  geo.attributes.position = blade.attributes.position;
  geo.attributes.uv = blade.attributes.uv;
  const pos = new Float32Array(N * 3), scl = new Float32Array(N), ph = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 2 + Math.pow(Math.random(), 0.7) * 13;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    pos.set([x, groundHeight(x, z) - 0.02, z], i * 3);
    scl[i] = 0.55 + Math.random() * 0.4;
    ph[i] = Math.random() * Math.PI * 2;
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(pos, 3));
  geo.setAttribute('iScl', new THREE.InstancedBufferAttribute(scl, 1));
  geo.setAttribute('iPh', new THREE.InstancedBufferAttribute(ph, 1));
  geo.instanceCount = N;
  const grassMat = new THREE.MeshStandardMaterial({
    color: 0x5d7a3f, roughness: 0.95, metalness: 0, side: THREE.DoubleSide,
  });
  grassMat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = grassUniforms.uTime;
    sh.vertexShader = 'attribute vec3 iPos;\nattribute float iScl;\nattribute float iPh;\nuniform float uTime;\n'
      + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        float swayAmt = smoothstep(0.05, 0.85, position.y);
        vec3 wp = iPos;
        transformed = position * iScl;
        transformed.x += sin(uTime * 1.7 + iPh + wp.x * 0.6) * 0.09 * swayAmt;
        transformed.z += cos(uTime * 1.3 + iPh + wp.z * 0.5) * 0.07 * swayAmt;
        transformed += wp;`);
  };
  const grass = new THREE.Mesh(geo, grassMat);
  grass.frustumCulled = false;
  scene.add(grass);
}

const selectables = [];   // 可点击物体
const colliders = [];     // 人物碰撞体 {x,z,r}

/* ============ 松树（下载的 Poly by Google "Pine tree" CC-BY 模型，3 种形态） ============ */
setProgress(0.58, '加载松树模型…');
/* 注: models/pine.glb 在仓库中以 base64 文本形式存储（推送工具无法传输二进制），此处拉取后解码 */
async function loadPineGltf() {
  const b64 = (await (await fetch(ASSETS.pine)).text()).trim();
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
  return await new Promise((res, rej) => gltfLoader.parse(bin, '', res, rej));
}
const pineSpots = [];
for (let i = 0; i < 22; i++) {
  const a = (i / 22) * Math.PI * 2 + (Math.random() - 0.5) * 0.22;
  const r = 24 + Math.random() * 13;
  pineSpots.push([Math.cos(a) * r, Math.sin(a) * r, 6 + Math.random() * 3]);
}
pineSpots.push([10.5, 5, 7.5], [-9, 8, 6], [4, -11.5, 6.5]);  // 空地边缘点缀，第三个数为目标树高(米)
const PINE_INFO = { tag: '植被', name: '松树',
  desc: 'Poly by Google 低多边形松树（CC-BY），3 种形态随机分布。Poly Haven 的扫描松树单棵数 GB，不适合手机，故选用此轻量模型。' };
let pineOk = false;
try {
  const pineGltf = await Promise.race([
    loadPineGltf(),
    new Promise((_, rej) => setTimeout(() => rej(new Error('pine timeout')), 25000)),
  ]);
  pineGltf.scene.updateMatrixWorld(true);
  const variants = [];
  for (const node of pineGltf.scene.children) {
    node.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(node);
    const c = box.getCenter(new THREE.Vector3());
    const wrap = new THREE.Group();
    const inner = node.clone();
    inner.position.set(-c.x, -box.min.y + 0.02, -c.z);
    wrap.add(inner);
    wrap.userData.height = box.max.y - box.min.y;  // 模型自身高度（单位与作者有关，按此归一化到目标米数）
    variants.push(wrap);
  }
  for (const [x, z, h] of pineSpots) {
    const v = variants[(Math.random() * variants.length) | 0];
    const t = v.clone();
    t.scale.setScalar(h / v.userData.height);
    t.position.set(x, groundHeight(x, z), z);
    t.rotation.y = Math.random() * Math.PI * 2;
    t.userData.info = PINE_INFO;
    scene.add(t);
    selectables.push(t);
    colliders.push({ x, z, r: h * 0.055 });
  }
  pineOk = variants.length > 0;
  setProgress(0.7, '松树就绪 · 摆放岩石…');
} catch (e) { console.warn('松树模型加载失败:', e); }
if (!pineOk) {
  /* 备用：简易程序化松树（模型加载失败/超时时保证森林观感） */
  const trunkG = new THREE.CylinderGeometry(0.16, 0.24, 2.0, 7);
  const leafG = new THREE.ConeGeometry(1.5, 3.4, 8);
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 1 });
  const leafM = new THREE.MeshStandardMaterial({ color: 0x2e5230, roughness: 1 });
  for (const [x, z, h] of pineSpots) {
    const s = h / 7;
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(trunkG, trunkM);
    trunk.position.y = 1.0; trunk.castShadow = true;
    tree.add(trunk);
    for (let k = 0; k < 3; k++) {
      const cone = new THREE.Mesh(leafG, leafM);
      cone.position.y = 2.2 + k * 1.35;
      cone.scale.setScalar(1 - k * 0.22);
      cone.castShadow = true;
      tree.add(cone);
    }
    tree.position.set(x, groundHeight(x, z), z);
    tree.rotation.y = Math.random() * Math.PI * 2;
    tree.scale.setScalar(s);
    tree.userData.info = { tag: '植被', name: '松树（备用）', desc: '松树模型加载失败时的备用树木。' };
    scene.add(tree);
    selectables.push(tree);
    colliders.push({ x, z, r: h * 0.055 });
  }
  setProgress(0.7, '松树模型不可用 · 已使用备用树木');
}

/* ============ 岩石（rock_boulder_dry PBR） ============ */
const rk = pbr(ASSETS.rock, 1.4, 1.4);
const rockMat = new THREE.MeshStandardMaterial({
  map: rk.map, normalMap: rk.nrm, roughnessMap: rk.rgh,
  roughness: 1.0, metalness: 0.0, color: 0xcfd2cc,
});
[[7.5, 3.5, 1.15, '花岗岩巨石', '表面干燥粗糙，苔藓沿着背阴面生长。Poly Haven 1K PBR：漫反射 / 法线 / 粗糙度。'],
 [-6.5, -4.5, 0.8, '碎石', '从山坡滚落至此，棱角被岁月磨圆。'],
 [2.5, 9.5, 0.55, '小石块', '半埋在草丛里，孩子们常坐在这上面。'],
].forEach(([x, z, s, name, desc]) => {
  const rock = new THREE.Mesh(jitter(new THREE.IcosahedronGeometry(s, 3), s * 0.16, 1.6), rockMat);
  rock.position.set(x, groundHeight(x, z) + s * 0.28, z);
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  rock.castShadow = rock.receiveShadow = true;
  rock.userData.info = { tag: '岩石', name, desc };
  scene.add(rock);
  selectables.push(rock);
  colliders.push({ x, z, r: s * 0.95 });
});

/* ============ 树桩（bark_brown_02 PBR） ============ */
const bk = pbr(ASSETS.bark, 2, 2);
const barkMat = new THREE.MeshStandardMaterial({
  map: bk.map, normalMap: bk.nrm, roughnessMap: bk.rgh,
  roughness: 1.0, metalness: 0.0, color: 0xd8cfc4,
});
{
  const stump = new THREE.Mesh(jitter(new THREE.CylinderGeometry(0.55, 0.72, 0.8, 14), 0.05, 2), barkMat);
  const sx = -4.2, sz = 6.8;
  stump.position.set(sx, groundHeight(sx, sz) + 0.32, sz);
  stump.castShadow = stump.receiveShadow = true;
  stump.userData.info = { tag: '木质', name: '松树桩',
    desc: '被锯断的老松树，断面年轮清晰。树皮为 Poly Haven bark_brown_02 实拍 PBR。' };
  scene.add(stump);
  selectables.push(stump);
  colliders.push({ x: sx, z: sz, r: 0.75 });
}
setProgress(0.78, '场景搭建完成 · 加载人物…');

/* ============ 漂浮光尘 ============ */
{
  const N = 130, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 16;
    pos.set([Math.cos(a) * r, 0.4 + Math.random() * 4.5, Math.sin(a) * r], i * 3);
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(dg, new THREE.PointsMaterial({
    color: 0xfff6d8, size: 0.09, transparent: true, opacity: 0.55,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
  }));
  dust.userData.isDust = true;
  scene.add(dust);
  var dustPts = dust;
}

/* ============ 骑士（KayKit CC0，可操控：奔跑/跳跃/攻击） ============ */
const UP = new THREE.Vector3(0, 1, 0);
const player = { group: new THREE.Group(), model: null, mixer: null, act: {}, action: null,
  clips: {}, mode: 'idle', pos: new THREE.Vector3(0, 0, 8), yaw: Math.PI,
  vy: 0, grounded: true, speed: 0, ready: false, attackT: 0, attackDur: 0, kOff: 0 };
player.fadeTo = (name, dur = 0.25) => {
  const next = player.act[name];
  if (!next || player.action === next) return;
  if (player.action) player.action.fadeOut(dur);
  next.reset().fadeIn(dur).play();
  player.action = next;
};
scene.add(player.group);
setProgress(0.84, '加载骑士…');
try {
  const kgltf = await Promise.race([
    gltfLoader.loadAsync(ASSETS.knight),
    new Promise((_, rej) => setTimeout(() => rej(new Error('knight timeout')), 45000)),
  ]);
  const m = kgltf.scene;
  m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  /* 双脚着地：模型原点不在脚底，按包围盒修正 */
  const kbox = new THREE.Box3().setFromObject(m);
  player.kOff = -kbox.min.y;
  m.position.y = player.kOff;
  player.group.add(m);
  player.model = m;
  player.mixer = new THREE.AnimationMixer(m);
  for (const c of kgltf.animations) player.clips[c.name] = c;
  for (const n of ['Idle', 'Running_A', '1H_Melee_Attack_Chop', '1H_Melee_Attack_Stab']) {
    const clip = player.clips[n];
    if (!clip) continue;
    const a = player.mixer.clipAction(clip);
    if (n.startsWith('1H_Melee')) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
    player.act[n] = a;
  }
  player.fadeTo('Idle', 0.1);
  /* 佩剑：Quaternius CC0，挂到右手武器槽 */
  try {
    const sb64 = (await (await fetch(ASSETS.sword)).text()).trim();
    const sbin = Uint8Array.from(atob(sb64), (c) => c.charCodeAt(0)).buffer;
    const sgltf = await new Promise((res, rej) => gltfLoader.parse(sbin, '', res, rej));
    const sword = sgltf.scene;
    sword.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    const slot = m.getObjectByName('handslot.r') || m.getObjectByName('hand.r');
    if (slot) { slot.add(sword); sword.rotation.set(0, 0, Math.PI / 2); }
    else console.warn('未找到右手骨骼');
  } catch (e) { console.warn('剑加载失败:', e); }
  player.pos.y = groundHeight(0, 8);
  m.userData.info = { tag: '人物', name: '骑士',
    desc: '由你操控的骑士（KayKit CC0 模型，着甲佩剑）。左侧摇杆（或 WASD）奔跑，⚔️ 按钮（或 F）挥剑攻击，右侧按钮（或空格）跳跃。' };
  selectables.push(player.group);
  player.ready = true;
  setProgress(0.88, '骑士就绪 · 合成后期…');
} catch (e) {
  console.warn('骑士加载失败:', e);
  setProgress(0.88, '骑士加载失败 · 请检查网络后刷新');
}

/* 初始镜头：人物身后 */
camera.position.set(player.pos.x, player.pos.y + 4.4, player.pos.z + 9.5);
controls.target.set(player.pos.x, player.pos.y + 1.7, player.pos.z);
controls.update();

/* ============ 后期（克制自然） ============ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const toneEffect = new EffectPass(camera,
  new BloomEffect({ intensity: 0.35, luminanceThreshold: 0.82, luminanceSmoothing: 0.2 }),
  new VignetteEffect({ offset: 0.22, darkness: 0.5 }),
);
composer.addPass(toneEffect);
setProgress(0.95, '完成');

/* ============ 输入：摇杆 / 按钮 / 键盘 ============ */
const input = { x: 0, y: 0, joyActive: false };
let jumpQueued = false, attackQueued = false;
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') { jumpQueued = true; e.preventDefault(); }
  if (e.code === 'KeyF') { attackQueued = true; }
});
addEventListener('keyup', (e) => keys[e.code] = false);

const joyEl = document.getElementById('joy');
const knobEl = document.getElementById('knob');
const jumpEl = document.getElementById('jumpBtn');
const attackEl = document.getElementById('attackBtn');
if (isTouch && player.ready) { joyEl.classList.add('show'); jumpEl.classList.add('show'); attackEl.classList.add('show'); }
let joyId = null;
function joyHandle(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2 - 14, len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  input.x = dx / max; input.y = dy / max;
}
joyEl.addEventListener('pointerdown', (e) => { joyId = e.pointerId; joyEl.setPointerCapture(joyId); input.joyActive = true; joyHandle(e); });
joyEl.addEventListener('pointermove', (e) => { if (e.pointerId === joyId) joyHandle(e); });
const joyEnd = (e) => {
  if (e.pointerId !== joyId) return;
  joyId = null; input.joyActive = false; input.x = input.y = 0;
  knobEl.style.transform = 'translate(-50%,-50%)';
};
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);
jumpEl.addEventListener('pointerdown', (e) => { jumpQueued = true; e.preventDefault(); });
attackEl.addEventListener('pointerdown', (e) => { attackQueued = true; e.preventDefault(); });

/* ============ 攻击：挥剑 + 弧光特效 ============ */
const slashes = [];
function tryAttack() {
  if (!player.ready || player.attackT > 0) return;
  const names = ['1H_Melee_Attack_Chop', '1H_Melee_Attack_Stab'].filter((n) => player.act[n]);
  if (!names.length) return;
  const name = names[(Math.random() * names.length) | 0];
  player.attackDur = Math.min(player.clips[name].duration, 1.2);
  player.attackT = player.attackDur;
  player.mode = 'attack';
  player.fadeTo(name, 0.1);
  const g = new THREE.TorusGeometry(1.15, 0.06, 8, 40, Math.PI * 1.2);
  const mt = new THREE.MeshBasicMaterial({ color: 0xd6ecff, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, mt);
  const gy = groundHeight(player.pos.x, player.pos.z);
  mesh.position.set(
    player.pos.x + Math.sin(player.yaw) * 1.1,
    gy + 1.35,
    player.pos.z + Math.cos(player.yaw) * 1.1);
  mesh.rotation.set(Math.PI / 2.4, player.yaw, 0);
  mesh.userData.t = 0.35;
  scene.add(mesh);
  slashes.push(mesh);
}

function readInput() {
  if (input.joyActive) return { x: input.x, y: input.y };
  const x = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
  const y = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);
  return { x, y };
}
function dampAngle(a, b, lambda, dt) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * (1 - Math.exp(-lambda * dt));
}

/* ============ UI：按钮 / 信息卡 / 点击选择 ============ */
const autoBtn = document.getElementById('autoBtn');
const resetBtn = document.getElementById('resetBtn');
const card = document.getElementById('card');
const hint = document.getElementById('hint');
autoBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; autoBtn.classList.toggle('on', controls.autoRotate); };
resetBtn.onclick = () => {
  const bx = player.pos.x - Math.sin(player.yaw) * -9.5, bz = player.pos.z - Math.cos(player.yaw) * -9.5;
  camera.position.set(bx, player.pos.y + 4.4, bz);
  controls.target.set(player.pos.x, player.pos.y + 1.7, player.pos.z);
};
document.getElementById('cardClose').onclick = () => card.classList.remove('show');
hint.textContent = isTouch ? '摇杆奔跑 · ⚔️攻击 · 跳跃 · 点击物体查看 · 双指缩放' : 'WASD 奔跑 · F 攻击 · 空格跳跃 · 点击物体查看 · 滚轮缩放';
setTimeout(() => hint.classList.add('show'), 1200);
setTimeout(() => hint.classList.add('hide'), 9000);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = 0, downXY = [0, 0];
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = performance.now(); downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (performance.now() - downAt > 350 || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 12) return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(selectables, true);
  if (!hits.length) { card.classList.remove('show'); return; }
  let o = hits[0].object;
  while (o && !o.userData.info) o = o.parent;
  if (!o) return;
  const info = o.userData.info;
  document.getElementById('cardTag').textContent = info.tag;
  document.getElementById('cardTitle').textContent = info.name;
  document.getElementById('cardDesc').textContent = info.desc;
  card.classList.add('show');
});

/* ============ 主循环 ============ */
const clock = new THREE.Clock();
const tmpFwd = new THREE.Vector3(), tmpRight = new THREE.Vector3(), tmpT = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  grassUniforms.uTime.value += dt;
  if (dustPts) { dustPts.rotation.y += dt * 0.02; dustPts.position.y = Math.sin(clock.elapsedTime * 0.4) * 0.15; }

  if (player.ready) {
    /* 输入 → 相机相对方向 */
    const { x: ix, y: iy } = readInput();
    const mag = Math.min(1, Math.hypot(ix, iy));
    if ((mag > 0.08 || jumpQueued || attackQueued) && controls.autoRotate) {
      controls.autoRotate = false; autoBtn.classList.remove('on');
    }
    /* 攻击状态机：挥剑时锁定移动 */
    if (attackQueued) { attackQueued = false; tryAttack(); }
    const attacking = player.attackT > 0;
    if (attacking) {
      player.attackT -= dt;
      player.speed += (0 - player.speed) * Math.min(1, dt * 10);
      if (player.attackT <= 0 && player.mode === 'attack') {
        player.mode = 'Idle'; player.fadeTo('Idle', 0.2);
      }
    } else {
      const want = mag > 0.08 ? 'Running_A' : 'Idle';
      if (player.mode !== want) { player.mode = want; player.fadeTo(want, 0.25); }
      const targetSpeed = mag * 6.0;
      player.speed += (targetSpeed - player.speed) * Math.min(1, dt * 8);
    }
    if (mag > 0.08 && !attacking) {
      camera.getWorldDirection(tmpFwd); tmpFwd.y = 0;
      if (tmpFwd.lengthSq() < 1e-6) tmpFwd.set(0, 0, -1); tmpFwd.normalize();
      tmpRight.crossVectors(tmpFwd, UP).normalize();
      const fx = -iy / (mag || 1), sx = ix / (mag || 1);
      const mx = (tmpFwd.x * fx + tmpRight.x * sx) * mag;
      const mz = (tmpFwd.z * fx + tmpRight.z * sx) * mag;
      player.yaw = dampAngle(player.yaw, Math.atan2(mx, mz), 10, dt);
      player.pos.x += mx * player.speed * dt;
      player.pos.z += mz * player.speed * dt;
    }
    /* 跳跃与重力 */
    if (player.grounded && jumpQueued) { player.vy = 5.6; player.grounded = false; }
    jumpQueued = false;
    if (!player.grounded) {
      player.vy -= 14 * dt;
      player.pos.y += player.vy * dt;
      const gh = groundHeight(player.pos.x, player.pos.z);
      if (player.pos.y <= gh) { player.pos.y = gh; player.grounded = true; player.vy = 0; }
    } else {
      player.pos.y = groundHeight(player.pos.x, player.pos.z);
    }
    /* 碰撞：树木/岩石推开，世界边界 */
    for (const c of colliders) {
      const dx = player.pos.x - c.x, dz = player.pos.z - c.z;
      const d = Math.hypot(dx, dz), min = c.r + 0.35;
      if (d < min && d > 1e-4) { player.pos.x = c.x + dx / d * min; player.pos.z = c.z + dz / d * min; }
    }
    const rr = Math.hypot(player.pos.x, player.pos.z);
    if (rr > 40) { player.pos.x *= 40 / rr; player.pos.z *= 40 / rr; }
    /* 跑步动画速度匹配 */
    if (player.action === player.act['Running_A'] && player.speed > 0.5) {
      player.action.timeScale = 0.75 + (player.speed / 6) * 0.55;
    } else if (player.action) {
      player.action.timeScale = 1;
    }
    player.group.position.copy(player.pos);
    player.group.rotation.y = player.yaw;
    player.mixer.update(dt);
    /* 挥砍弧光更新 */
    for (let i = slashes.length - 1; i >= 0; i--) {
      const s = slashes[i];
      s.userData.t -= dt;
      const k = Math.max(0, s.userData.t / 0.35);
      s.material.opacity = k * 0.9;
      s.scale.setScalar(1 + (1 - k) * 0.7);
      if (s.userData.t <= 0) { scene.remove(s); s.geometry.dispose(); s.material.dispose(); slashes.splice(i, 1); }
    }
    /* 镜头跟随：目标点平滑追人物，保持用户旋转偏移 */
    tmpT.copy(player.pos); tmpT.y += 1.7;
    tmpT.sub(controls.target).multiplyScalar(Math.min(1, dt * 4.5));
    controls.target.add(tmpT);
    camera.position.add(tmpT);
  }

  controls.update();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* 收尾 */
setProgress(1, '欢迎来到森林空地');
setTimeout(() => {
  document.getElementById('loader').classList.add('done');
  document.getElementById('hud').classList.add('show');
  document.getElementById('btns').classList.add('show');
}, 500);
</script>
</body>
