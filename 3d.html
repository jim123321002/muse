<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js 3D 演示</title>
<style>
  body { margin: 0; overflow: hidden; background: #050510; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 16px; left: 16px; color: #fff; background: rgba(0,0,0,.45);
          padding: 10px 16px; border-radius: 10px; font-size: 14px; pointer-events: none; z-index: 10; }
  #info b { color: #ffd166; }
</style>
</head>
<body>
<div id="info">🖱️ 拖拽旋转 · 滚轮缩放 · 右键平移<br>点击任意处：<b>切换颜色</b></div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.015);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 2.5, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 主体：扭结环
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(2, 0.55, 220, 36),
  new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.25, metalness: 0.75 })
);
scene.add(knot);

// 灯光
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const l1 = new THREE.PointLight(0xff5e8a, 120, 60); l1.position.set(6, 6, 6);  scene.add(l1);
const l2 = new THREE.PointLight(0x4f8cff, 120, 60); l2.position.set(-6, -4, -6); scene.add(l2);

// 星空
const starPos = [];
for (let i = 0; i < 1600; i++)
  starPos.push((Math.random() - .5) * 220, (Math.random() - .5) * 220, (Math.random() - .5) * 220);
const stars = new THREE.BufferGeometry();
stars.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(stars, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18 })));

// 彩色轨道环
const rings = [];
[0xffd166, 0x06d6a0, 0xef476f].forEach((c, i) => {
  const r = new THREE.Mesh(
    new THREE.TorusGeometry(4 + i * 0.9, 0.035, 8, 120),
    new THREE.MeshBasicMaterial({ color: c })
  );
  r.rotation.x = Math.PI / 2 + (i - 1) * 0.35;
  scene.add(r); rings.push(r);
});

// 绕行的小方块
const cubes = [];
const cubeGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
for (let i = 0; i < 24; i++) {
  const c = new THREE.Mesh(cubeGeo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(i / 24, 0.9, 0.6), roughness: 0.3, metalness: 0.6 }));
  c.userData = { a: (i / 24) * Math.PI * 2, r: 5.5 + Math.random() * 2, s: 0.4 + Math.random() * 0.6, h: Math.random() * Math.PI * 2 };
  scene.add(c); cubes.push(c);
}

// 点击切换主体颜色
const palette = [0x8b5cf6, 0x06d6a0, 0xef476f, 0xffd166, 0x4f8cff];
let pi = 0;
addEventListener('pointerdown', e => {
  if (e.target === renderer.domElement) {
    pi = (pi + 1) % palette.length;
    knot.material.color.setHex(palette[pi]);
  }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  knot.rotation.x = t * 0.25; knot.rotation.y = t * 0.4;
  knot.position.y = Math.sin(t * 1.2) * 0.4;
  rings.forEach((r, i) => { r.rotation.z = t * (0.15 + i * 0.1); });
  cubes.forEach(c => {
    const u = c.userData, a = u.a + t * u.s;
    c.position.set(Math.cos(a) * u.r, Math.sin(t * 1.5 + u.h) * 1.2, Math.sin(a) * u.r);
    c.rotation.x = t * 2; c.rotation.y = t * 1.5;
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
